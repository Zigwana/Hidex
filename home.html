<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<meta
name="theme-color"
content="#FBF8F1">

<title>Hidex</title>

<link
rel="stylesheet"
href="css/home.css">

<link
rel="stylesheet"
href="css/users.css">

<link
rel="stylesheet"
href="css/group-view.css">

</head>

<body>

<!-- =====================================================
     DASHBOARD
===================================================== -->

<div
class="home"
id="main-dashboard">

    <!-- =====================================================
         TOP BAR
    ===================================================== -->

    <header class="topBar">

        <h2 class="logo">

            HIDEX

        </h2>

        <input

            id="search"

            type="search"

            placeholder="Search chats..."

            autocomplete="off"

        >

        <div class="settings">

            <img

                src="images/settings.png"

                id="settingsBtn"

                alt="Settings"

            >

            <div id="settingsMenu">

                <a href="profiledisplay.html">

                    My Profile

                </a>

                <a href="profile.html">

                    Edit Profile

                </a>

                <a href="#">

                    Feedback

                </a>

                <a href="#">

                    Reviews

                </a>

                <a href="#">

                    Suggest Feature

                </a>

                <a

                    href="#"

                    id="logout"

                >

                    Logout

                </a>

            </div>

        </div>

    </header>

    <!-- =====================================================
         PROFILE CARD
    ===================================================== -->

    <section

        id="profile"

        class="profileCard"

    >

        Loading profile...

    </section>

    <!-- =====================================================
         CHATS TAB
    ===================================================== -->

    <section

        id="messages"

        class="page"

    >

        <div

            id="notifications"

        >

            Loading conversations...

        </div>

    </section>
        <!-- ==========================================
         PROFILE CARD
    =========================================== -->

    <div id="profile" class="profileCard">
        Loading profile...
    </div>


    <!-- ==========================================
         TAB : CHATS
    =========================================== -->

    <section
        id="messages"
        class="page active-page"
    >

        <div id="notifications">

            <div class="user-card">

                <h3>Loading chats...</h3>

            </div>

        </div>

    </section>


    <!-- ==========================================
         TAB : GROUPS
    =========================================== -->

    <section
        id="groupsTab"
        class="page"
        style="display:none;"
    >

        <div id="groups">

            <div class="user-card">

                <h3>Loading groups...</h3>

            </div>

        </div>

    </section>


    <!-- ==========================================
         TAB : PEOPLE
    =========================================== -->

    <section
        id="usersTab"
        class="page"
        style="display:none;"
    >

        <input
            id="user-search"
            type="text"
            placeholder="Search username or Hidex ID"
        >

        <div id="userList">

            <div class="user-card">

                <h3>Loading users...</h3>

            </div>

        </div>

    </section>


    <!-- ==========================================
         TAB : CHANNELS
    =========================================== -->

    <section
        id="channels"
        class="page"
        style="display:none;"
    >

        <button
            class="channelButton"
            onclick="location.href='community.html'"
        >

            🌍 Global Chat

        </button>

    </section>


    <!-- ==========================================
         FLOATING BUTTON
    =========================================== -->

    <img
        src="images/plus.png"
        class="plusButton"
        alt="Find Friends"
        onclick="showTab('usersTab')"
    >

</div>


<!-- ==========================================
     BOTTOM NAVIGATION
=========================================== -->

<nav class="tabs">

    <button
        id="tab-btn-messages"
        class="active"
        onclick="showTab('messages')"
    >
        Chats
    </button>

    <button
        id="tab-btn-groupsTab"
        onclick="showTab('groupsTab')"
    >
        Groups
    </button>

    <button
        id="tab-btn-usersTab"
        onclick="showTab('usersTab')"
    >
        People
    </button>

    <button
        id="tab-btn-channels"
        onclick="showTab('channels')"
    >
        Channels
    </button>

</nav>
    
    <!-- GROUP VIEW -->

<!-- ===========================
     GROUP VIEW
=========================== -->

<div id="group-view-overlay" class="group-overlay" style="display:none;">

    <div class="group-window">

        <div class="group-header">

            <button onclick="closeGroupOverlay()">←</button>

            <img
                id="groupImage"
                src="images/default.png"
                class="group-avatar"
            >

            <div class="group-title">

                <h2 id="groupName"></h2>

                <small id="groupCount"></small>

            </div>

        </div>

        <div class="group-info">

            <p id="groupDescription"></p>

            <button id="toggleMembers">

                Members ▼

            </button>

            <div
                id="members"
                style="display:none;"
            ></div>

        </div>

        <div
            id="chat"
            class="group-chat"
        ></div>

        <div class="message-bar">

            <input
                id="messageText"
                type="text"
                placeholder="Type a message..."
            >

            <button id="sendMessage">

                Send

            </button>

        </div>

    </div>

</div>
    <!-- ===========================
     UI SCRIPTS
=========================== -->
<script>
const settingsBtn = document.getElementById("settingsBtn");
const settingsMenu = document.getElementById("settingsMenu");

if (settingsBtn && settingsMenu) {

    settingsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        settingsMenu.classList.toggle("show");
    });

    document.addEventListener("click", () => {
        settingsMenu.classList.remove("show");
    });

}

// ------------------------------
// Bottom Tabs
// ------------------------------

function showTab(tabId){

    const pages = document.querySelectorAll(".page");

    pages.forEach(page=>{
        page.style.display="none";
    });

    document.querySelectorAll(".tabs button")
    .forEach(button=>{
        button.classList.remove("active");
    });

    const page=document.getElementById(tabId);

    if(page){

        page.style.display="flex";
        page.style.flexDirection="column";

    }

    const tab=document.getElementById(
        "tab-btn-"+tabId
    );

    if(tab){

        tab.classList.add("active");

    }

}

// Default tab

showTab("messages");

// ------------------------------
// Group Overlay
// ------------------------------

window.openGroupView=function(){

    const overlay=
    document.getElementById(
        "group-view-overlay"
    );

    const plus=
    document.querySelector(
        ".plusButton"
    );

    if(overlay){

        overlay.style.display="flex";

    }

    if(plus){

        plus.style.display="none";

    }

};

window.closeGroupView=function(){

    const overlay=
    document.getElementById(
        "group-view-overlay"
    );

    const plus=
    document.querySelector(
        ".plusButton"
    );

    if(overlay){

        overlay.style.display="none";

    }

    if(plus){

        plus.style.display="block";

    }

};
</script>

<!-- ===========================
     APP SCRIPTS
=========================== -->

<script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
<script type="module" src="js/home.js"></script>
<script type="module" src="js/users.js"></script>
<script type="module" src="js/group-view.js"></script>

</body>
</html>
